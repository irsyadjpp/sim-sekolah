server {
    listen 80;
    server_name localhost;

    # Root directory where static assets reside
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Support standard SPA routing: Redirect all requests to index.html if not found
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets heavily to optimize load time
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm|wav|mp3|m4a|aac|oga)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
