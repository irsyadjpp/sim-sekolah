syntax = "proto3";

package ai_platform.retrieval_service;

option go_package = "sim-sekolah/internal/ai/grpc/pb/retrievalservice";

// Retrieval Service - Fase 3.2
service RetrievalService {
    rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse);
    rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);
    rpc FilterByMetadata(FilterByMetadataRequest) returns (FilterByMetadataResponse);
    rpc BuildContext(BuildContextRequest) returns (BuildContextResponse);
    rpc ExpandQuery(ExpandQueryRequest) returns (ExpandQueryResponse);
    rpc GetRelevanceScores(GetRelevanceScoresRequest) returns (GetRelevanceScoresResponse);
}

// Retrieval Service Messages
message SemanticSearchRequest {
    string query_id = 1;
    string query_text = 2;
    string collection_name = 3;
    int32 limit = 4;
    map<string, string> filters = 5;
    map<string, string> options = 6;
}

message SemanticSearchResponse {
    bool success = 1;
    string message = 2;
    SearchResult result = 3;
    map<string, string> metadata = 4;
}

message SearchResult {
    repeated RetrievedDocument documents = 1;
    SearchSummary summary = 2;
}

message RetrievedDocument {
    string document_id = 1;
    string content = 2;
    float score = 3;
    map<string, string> metadata = 4;
}

message SearchSummary {
    int32 total_results = 1;
    float search_time_ms = 2;
    string search_strategy = 3;
}

message HybridSearchRequest {
    string query_id = 1;
    string query_text = 2;
    string collection_name = 3;
    float semantic_weight = 4;
    float keyword_weight = 5;
    int32 limit = 6;
    map<string, string> filters = 7;
    map<string, string> options = 8;
}

message HybridSearchResponse {
    bool success = 1;
    string message = 2;
    SearchResult result = 3;
    map<string, string> metadata = 4;
}

message FilterByMetadataRequest {
    string collection_name = 1;
    map<string, string> filters = 2;
    int32 limit = 3;
    map<string, string> options = 4;
}

message FilterByMetadataResponse {
    bool success = 1;
    string message = 2;
    FilterResult result = 3;
    map<string, string> metadata = 4;
}

message FilterResult {
    repeated RetrievedDocument documents = 1;
    int32 total_filtered = 2;
    repeated string applied_filters = 3;
}

message BuildContextRequest {
    string query_id = 1;
    repeated RetrievedDocument documents = 2;
    int32 max_context_length = 3;
    map<string, string> options = 4;
}

message BuildContextResponse {
    bool success = 1;
    string message = 2;
    ContextResult result = 3;
    map<string, string> metadata = 4;
}

message ContextResult {
    string context = 1;
    repeated ContextSource sources = 2;
    int32 total_tokens = 3;
}

message ContextSource {
    string document_id = 1;
    repeated int32 used_chunk_indices = 2;
    string snippet = 3;
}

message ExpandQueryRequest {
    string query_id = 1;
    string original_query = 2;
    string expansion_strategy = 3;
    int32 num_expansions = 4;
    map<string, string> options = 5;
}

message ExpandQueryResponse {
    bool success = 1;
    string message = 2;
    QueryExpansionResult result = 3;
    map<string, string> metadata = 4;
}

message QueryExpansionResult {
    repeated ExpandedQuery expanded_queries = 1;
}

message ExpandedQuery {
    string query_text = 1;
    float expansion_score = 2;
    string expansion_type = 3;
}

message GetRelevanceScoresRequest {
    string query_id = 1;
    repeated RetrievedDocument documents = 2;
    string query_text = 3;
    map<string, string> options = 4;
}

message GetRelevanceScoresResponse {
    bool success = 1;
    string message = 2;
    RelevanceScoringResult result = 3;
    map<string, string> metadata = 4;
}

message RelevanceScoringResult {
    repeated DocumentScore scores = 1;
    ScoringSummary summary = 2;
}

message DocumentScore {
    string document_id = 1;
    float relevance_score = 2;
    repeated ScoreComponent components = 3;
}

message ScoreComponent {
    string component_name = 1;
    float score = 2;
    float weight = 3;
}

message ScoringSummary {
    float average_score = 1;
    float min_score = 2;
    float max_score = 3;
    string scoring_method = 4;
}
