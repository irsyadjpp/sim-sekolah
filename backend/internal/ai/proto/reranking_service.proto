syntax = "proto3";

package ai_platform.reranking_service;

option go_package = "sim-sekolah/internal/ai/grpc/pb/rerankingservice";

// Reranking Service - Fase 3.4
service RerankingService {
    rpc RerankCrossEncoder(RerankCrossEncoderRequest) returns (RerankCrossEncoderResponse);
    rpc RerankMonoEncoder(RerankMonoEncoderRequest) returns (RerankMonoEncoderResponse);
    rpc CurriculumAwareRerank(CurriculumAwareRerankRequest) returns (CurriculumAwareRerankResponse);
    rpc PedagogyAwareRerank(PedagogyAwareRerankRequest) returns (PedagogyAwareRerankResponse);
    rpc CompetencyAwareRerank(CompetencyAwareRerankRequest) returns (CompetencyAwareRerankResponse);
    rpc HybridRerank(HybridRerankRequest) returns (HybridRerankResponse);
}

// Reranking Service Messages
message RerankCrossEncoderRequest {
    string query_id = 1;
    string query = 2;
    repeated RetrievalResult documents = 3;
    string reranking_model = 4;
    int32 top_k = 5;
    map<string, string> options = 6;
}

message RetrievalResult {
    string document_id = 1;
    string content = 2;
    float score = 3;
    map<string, string> metadata = 4;
}

message RerankCrossEncoderResponse {
    bool success = 1;
    string message = 2;
    RerankingResult result = 3;
    map<string, string> metadata = 4;
}

message RerankingResult {
    repeated RetrievalResult reranked_documents = 1;
    RerankingSummary summary = 2;
}

message RerankingSummary {
    string reranking_method = 1;
    float reranking_time_ms = 2;
    float improvement_score = 3;
    repeated Metric metrics = 4;
}

message Metric {
    string metric_name = 1;
    float value = 2;
}

message RerankMonoEncoderRequest {
    string query_id = 1;
    string query = 2;
    repeated RetrievalResult documents = 3;
    string reranking_model = 4;
    int32 top_k = 5;
    map<string, string> options = 6;
}

message RerankMonoEncoderResponse {
    bool success = 1;
    string message = 2;
    RerankingResult result = 3;
    map<string, string> metadata = 4;
}

message CurriculumAwareRerankRequest {
    string query_id = 1;
    string query = 2;
    repeated RetrievalResult documents = 3;
    string phase = 4;
    string grade = 5;
    string subject = 6;
    repeated string target_competencies = 7;
    int32 top_k = 8;
    map<string, string> options = 9;
}

message CurriculumAwareRerankResponse {
    bool success = 1;
    string message = 2;
    RerankingResult result = 3;
    map<string, string> metadata = 4;
}

message PedagogyAwareRerankRequest {
    string query_id = 1;
    string query = 2;
    repeated RetrievalResult documents = 3;
    string pedagogy_type = 4;
    string grade = 5;
    string subject = 6;
    repeated string learning_objectives = 7;
    int32 top_k = 8;
    map<string, string> options = 9;
}

message PedagogyAwareRerankResponse {
    bool success = 1;
    string message = 2;
    RerankingResult result = 3;
    map<string, string> metadata = 4;
}

message CompetencyAwareRerankRequest {
    string query_id = 1;
    string query = 2;
    repeated RetrievalResult documents = 3;
    repeated string target_competencies = 4;
    string subject = 5;
    string grade = 6;
    int32 top_k = 7;
    map<string, string> options = 8;
}

message CompetencyAwareRerankResponse {
    bool success = 1;
    string message = 2;
    RerankingResult result = 3;
    map<string, string> metadata = 4;
}

message HybridRerankRequest {
    string query_id = 1;
    string query = 2;
    repeated RetrievalResult documents = 3;
    repeated RerankingStrategy strategies = 4;
    repeated float strategy_weights = 5;
    int32 top_k = 6;
    map<string, string> options = 7;
}

message RerankingStrategy {
    string strategy_name = 1;
    string strategy_type = 2;
    map<string, string> parameters = 3;
}

message HybridRerankResponse {
    bool success = 1;
    string message = 2;
    RerankingResult result = 3;
    map<string, string> metadata = 4;
}
