syntax = "proto3";

package ai_platform.embedding_service;

option go_package = "sim-sekolah/internal/ai/grpc/pb/embeddingservice";

// Embedding Service - Fase 3.1
service EmbeddingService {
    rpc EmbedText(EmbedTextRequest) returns (EmbedTextResponse);
    rpc EmbedImage(EmbedImageRequest) returns (EmbedImageResponse);
    rpc EmbedTable(EmbedTableRequest) returns (EmbedTableResponse);
    rpc EmbedFormula(EmbedFormulaRequest) returns (EmbedFormulaResponse);
    rpc BatchEmbedText(BatchEmbedTextRequest) returns (BatchEmbedTextResponse);
    rpc GetEmbeddingInfo(GetEmbeddingInfoRequest) returns (GetEmbeddingInfoResponse);
}

// Embedding Service Messages
message EmbedTextRequest {
    string text_id = 1;
    string text_content = 2;
    string model = 3;
    map<string, string> options = 4;
}

message EmbedTextResponse {
    bool success = 1;
    string message = 2;
    EmbeddingResult result = 3;
    map<string, string> metadata = 4;
}

message EmbeddingResult {
    string text_id = 1;
    repeated float embedding = 2;
    int32 dimension = 3;
    string model = 4;
    float embedding_time_ms = 5;
}

message EmbedImageRequest {
    string image_id = 1;
    bytes image_data = 2;
    string model = 3;
    map<string, string> options = 4;
}

message EmbedImageResponse {
    bool success = 1;
    string message = 2;
    ImageEmbeddingResult result = 3;
    map<string, string> metadata = 4;
}

message ImageEmbeddingResult {
    string image_id = 1;
    repeated float embedding = 2;
    int32 dimension = 3;
    string model = 4;
    repeated string detected_objects = 5;
}

message EmbedTableRequest {
    string table_id = 1;
    repeated string headers = 2;
    repeated TableRow rows = 3;
    string model = 4;
    map<string, string> options = 5;
}

message TableRow {
    repeated string cells = 1;
}

message EmbedTableResponse {
    bool success = 1;
    string message = 2;
    TableEmbeddingResult result = 3;
    map<string, string> metadata = 4;
}

message TableEmbeddingResult {
    string table_id = 1;
    repeated float embedding = 2;
    int32 dimension = 3;
    string model = 4;
    repeated CellEmbedding cell_embeddings = 5;
}

message CellEmbedding {
    string cell_id = 1;
    repeated float embedding = 2;
}

message EmbedFormulaRequest {
    string formula_id = 1;
    string formula_latex = 2;
    string model = 3;
    map<string, string> options = 4;
}

message EmbedFormulaResponse {
    bool success = 1;
    string message = 2;
    FormulaEmbeddingResult result = 3;
    map<string, string> metadata = 4;
}

message FormulaEmbeddingResult {
    string formula_id = 1;
    repeated float embedding = 2;
    int32 dimension = 3;
    string model = 4;
    repeated FormulaComponent components = 5;
}

message FormulaComponent {
    string component_id = 1;
    repeated float embedding = 2;
    string component_type = 3;
}

message BatchEmbedTextRequest {
    repeated EmbedTextItem items = 1;
    string model = 2;
    map<string, string> options = 3;
}

message EmbedTextItem {
    string text_id = 1;
    string text_content = 2;
}

message BatchEmbedTextResponse {
    bool success = 1;
    string message = 2;
    BatchEmbeddingResult result = 3;
    map<string, string> metadata = 4;
}

message BatchEmbeddingResult {
    repeated EmbeddingResult embeddings = 1;
    BatchSummary summary = 2;
}

message BatchSummary {
    int32 total_items = 2;
    int32 successful_items = 3;
    int32 failed_items = 4;
    float average_time_ms = 5;
    float throughput_per_sec = 6;
}

message GetEmbeddingInfoRequest {
    string model = 1;
}

message GetEmbeddingInfoResponse {
    bool success = 1;
    string message = 2;
    ModelInfo result = 3;
    map<string, string> metadata = 4;
}

message ModelInfo {
    string model_name = 1;
    int32 dimension = 2;
    string model_type = 3;
    repeated string supported_languages = 4;
    int32 max_sequence_length = 5;
    string version = 6;
}
