syntax = "proto3";

package ai_platform.vision_service;

option go_package = "sim-sekolah/internal/ai/grpc/pb/visionservice";

// Vision Service - Fase 2.2
service VisionService {
    rpc ProcessOCR(ProcessOCRRequest) returns (ProcessOCRResponse);
    rpc AnalyzeDiagram(AnalyzeDiagramRequest) returns (AnalyzeDiagramResponse);
    rpc ExtractFormula(ExtractFormulaRequest) returns (ExtractFormulaResponse);
    rpc ClassifyImage(ClassifyImageRequest) returns (ClassifyImageResponse);
    rpc PreprocessImage(PreprocessImageRequest) returns (PreprocessImageResponse);
    rpc AnalyzeFigures(AnalyzeFiguresRequest) returns (AnalyzeFiguresResponse);
    rpc ClassifyFiguresForEducation(ClassifyFiguresForEducationRequest) returns (ClassifyFiguresForEducationResponse);
}

// Vision Service Messages
message ProcessOCRRequest {
    string image_id = 1;
    bytes image_data = 2;
    string language = 3;
    map<string, string> options = 4;
}

message ProcessOCRResponse {
    bool success = 1;
    string message = 2;
    OCRResult result = 3;
    map<string, string> metadata = 4;
}

message OCRResult {
    string text = 1;
    float confidence = 2;
    repeated OcrWord words = 3;
    repeated OcrLine lines = 4;
}

message OcrWord {
    string text = 1;
    float confidence = 2;
    BoundingBox bbox = 3;
}

message OcrLine {
    string text = 1;
    repeated OcrWord words = 2;
    BoundingBox bbox = 3;
}

message BoundingBox {
    int32 x = 1;
    int32 y = 2;
    int32 width = 3;
    int32 height = 4;
}

message AnalyzeDiagramRequest {
    string diagram_id = 1;
    bytes image_data = 2;
    string diagram_type = 3;
    map<string, string> options = 4;
}

message AnalyzeDiagramResponse {
    bool success = 1;
    string message = 2;
    DiagramAnalysis result = 3;
    map<string, string> metadata = 4;
}

message DiagramAnalysis {
    string diagram_type = 1;
    repeated DiagramElement elements = 2;
    repeated DiagramRelationship relationships = 3;
}

message DiagramElement {
    string element_id = 1;
    string element_type = 2;
    BoundingBox bbox = 3;
    map<string, string> properties = 4;
}

message DiagramRelationship {
    string source_id = 1;
    string target_id = 2;
    string relationship_type = 3;
}

message ExtractFormulaRequest {
    string image_id = 1;
    bytes image_data = 2;
    string formula_type = 3;
    map<string, string> options = 4;
}

message ExtractFormulaResponse {
    bool success = 1;
    string message = 2;
    FormulaExtraction result = 3;
    map<string, string> metadata = 4;
}

message FormulaExtraction {
    repeated Formula formulas = 1;
}

message Formula {
    string formula_id = 1;
    string latex = 2;
    string formula_type = 3;
    float confidence = 4;
    BoundingBox bbox = 5;
}

message ClassifyImageRequest {
    string image_id = 1;
    bytes image_data = 2;
    repeated string categories = 3;
    map<string, string> options = 4;
}

message ClassifyImageResponse {
    bool success = 1;
    string message = 2;
    ImageClassification result = 3;
    map<string, string> metadata = 4;
}

message ImageClassification {
    string primary_category = 1;
    float confidence = 2;
    repeated CategoryScore scores = 3;
}

message CategoryScore {
    string category = 1;
    float score = 2;
}

message PreprocessImageRequest {
    string image_id = 1;
    bytes image_data = 2;
    repeated string operations = 3;
    map<string, string> options = 4;
}

message PreprocessImageResponse {
    bool success = 1;
    string message = 2;
    ImagePreprocessing result = 3;
    map<string, string> metadata = 4;
}

message ImagePreprocessing {
    bytes processed_image = 1;
    repeated PreprocessingStep steps = 2;
}

message PreprocessingStep {
    string operation = 1;
    map<string, string> parameters = 2;
}

// Figure Analysis Messages - Integration dengan Parser Service
message AnalyzeFiguresRequest {
    repeated string minio_keys = 1;  // MinIO keys untuk figures yang ingin dianalisis
    map<string, string> context = 2;  // document context (subject, grade, etc.)
    map<string, string> options = 3;
}

message AnalyzeFiguresResponse {
    bool success = 1;
    string message = 2;
    repeated FigureAnalysisResult results = 3;
    map<string, string> metadata = 4;
}

message FigureAnalysisResult {
    string image_id = 1;
    string minio_key = 2;
    bool analysis_success = 3;
    string analysis_error = 4;
    string description = 5;
    float confidence = 6;
    repeated DetectedElement detected_elements = 7;
    repeated DetectedText detected_text = 8;
    map<string, string> metadata = 9;
}

message DetectedElement {
    string element_type = 1;
    string label = 2;
    float confidence = 3;
    BoundingBox bbox = 4;
}

message DetectedText {
    string text = 1;
    float confidence = 2;
    BoundingBox bbox = 3;
    string language = 4;
}

// Educational Figure Classification Messages
message ClassifyFiguresForEducationRequest {
    repeated string minio_keys = 1;
    map<string, string> context = 2;  // curriculum context
    map<string, string> options = 3;
}

message ClassifyFiguresForEducationResponse {
    bool success = 1;
    string message = 2;
    repeated EducationalFigureClassification results = 3;
    map<string, string> metadata = 4;
}

message EducationalFigureClassification {
    string image_id = 1;
    string minio_key = 2;
    string figure_type = 3;  // ILLUSTRATION, DIAGRAM, CHART, etc.
    string figure_role = 4;  // PRIMARY, SECONDARY, etc.
    string figure_subject = 5;  // IPA, IPS, MATEMATIKA, etc.
    float confidence = 6;
    bool is_educational = 7;
    bool is_p5_related = 8;
    bool is_assessment_related = 9;
    repeated string detected_elements = 10;
    repeated string educational_keywords = 11;
    string educational_significance = 12;  // ESSENTIAL, SUPPLEMENTARY, DECORATIVE
    map<string, string> metadata = 13;
}
