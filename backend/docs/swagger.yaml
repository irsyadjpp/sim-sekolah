        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Check school data readiness
      tags:
      - Curriculum
  /learning-outcomes:
    get:
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
