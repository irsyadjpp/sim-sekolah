    get:
      consumes:
      - application/json
      description: Mock export of the FINAL curriculum document
      parameters:
      - description: Curriculum Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Export Document to PDF
      tags:
      - Curriculum
