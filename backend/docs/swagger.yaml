  internal_student.CreateStudentRequest:
    properties:
      birth_certificate:
        description: Nomor registrasi Akta Kelahiran
        example: 1204/DISDUK/2015
        type: string
      birth_date:
        description: Tanggal lahir format YYYY-MM-DD
        example: "2015-08-20"
        type: string
      birth_place:
        description: Tempat lahir siswa
        example: Kepulauan Selayar
        type: string
      blood_type:
        description: Kesehatan
        example: O
        type: string
      child_order:
        description: Anak ke-berapa dalam keluarga
        example: 2
        type: integer
      coordinates:
        description: Titik koordinat peta (Latitude, Longitude)
        example: -7.3912,121.1293
        type: string
      curriculum:
        description: Jenis kurikulum yang diikuti
        example: Kurikulum Merdeka
        type: string
      disability:
        description: Kategori disabilitas jika berkebutuhan khusus
        example: TIDAK ADA
        type: string
      district:
        description: Kecamatan
        example: Pasimarannu
        type: string
      enrollment_year:
        description: Data Sekolah
        example: 2026
        type: integer
      entry_path:
        description: Jalur masuk sekolah (e.g. ZONASI, REGULER)
        example: PPDB REGULER
        type: string
      exam_number:
        description: Nomor ujian sekolah sebelumnya
        example: U-99887766
        type: string
      family_card_number:
        description: Nomor Kartu Keluarga (KK)
        example: "7301021208100003"
        type: string
      full_address:
        description: Alamat
        example: Jl. Bonerate Raya No. 4
        type: string
      full_name:
        description: Identitas
        example: Rian Hidayat
        maxLength: 255
        type: string
      gender:
        description: 'Jenis kelamin: ''L'' (Laki-laki) atau ''P'' (Perempuan)'
        enum:
        - L
        - P
        example: L
        type: string
      height:
        description: Tinggi badan dalam centimeter (cm)
        example: 125.5
        type: number
      kip_number:
        description: Nomor Kartu Indonesia Pintar (jika ada)
        example: KIP-88776655
        type: string
      medical_history:
        description: Riwayat penyakit bawaan atau kronis
        example: Tidak ada riwayat penyakit kronis
        type: string
      nationality:
        description: Kewarganegaraan
        example: WNI
        type: string
      nik:
        description: Kependudukan
        example: "7301022008150002"
        type: string
      nis:
        description: Nomor Induk Siswa lokal sekolah
        example: "202601001"
        maxLength: 20
        type: string
      nisn:
        description: Nomor Induk Siswa Nasional (10 digit)
        example: "0151234567"
        maxLength: 20
        type: string
      photo_url:
        description: URL berkas foto profil siswa
        example: https://example.com/photos/rian.jpg
        type: string
      postal_code:
        description: Kode Pos
        example: "92854"
        type: string
      previous_school:
        description: Nama asal sekolah tingkat sebelumnya
        example: TK Pembina Bonerate
        type: string
      province:
        description: Provinsi
        example: Sulawesi Selatan
        type: string
      regency:
        description: Kabupaten / Kota
        example: Kepulauan Selayar
        type: string
      religion:
        description: Agama siswa
        example: Islam
        type: string
      rt_rw:
        description: RT/RW domisili
        example: 001/002
        type: string
      school_id:
        description: UUID Sekolah tempat siswa terdaftar
        example: 804b75d4-2822-48a7-8eba-3566f038f81f
        type: string
      siblings:
        description: Jumlah saudara kandung
        example: 3
        type: integer
      student_status:
        description: Status keaktifan (e.g. AKTIF, LULUS, MUTASI)
        example: AKTIF
        type: string
      village:
        description: Kelurahan / Desa
        example: Bonerate
        type: string
      weight:
        description: Berat badan dalam kilogram (kg)
        example: 28.4
        type: number
    required:
    - full_name
    - school_id
    type: object
