  internal_promotion.GraduateRequest:
    properties:
      student_ids:
        items:
          type: string
        type: array
    required:
    - student_ids
    type: object
  internal_promotion.PromoteRequest:
    properties:
      source_classroom_id:
        type: string
      student_ids:
        items:
          type: string
        type: array
      target_classroom_id:
        type: string
    required:
    - source_classroom_id
    - student_ids
    - target_classroom_id
    type: object
  internal_schedule.CreateScheduleRequest:
    properties:
      classroom_id:
        type: string
      day_of_week:
        maximum: 7
        minimum: 1
        type: integer
      end_time:
        type: string
      start_time:
        type: string
      teaching_assignment_id:
