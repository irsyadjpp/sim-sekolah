  internal_student.UpsertParentRequest:
    properties:
      education:
        description: Tingkat pendidikan terakhir (e.g. SD, SMP, SMA, S1, S2)
        example: S1
        type: string
      full_name:
        description: Nama lengkap orang tua / wali sesuai identitas resmi
        example: Ahmad Basri
        type: string
      income:
        description: Penghasilan bulanan dalam Rupiah (e.g. 4500000)
        example: 4500000
        type: integer
      nik:
        description: Nomor Induk Kependudukan orang tua (16 digit)
        example: "7301021208750001"
        type: string
      occupation:
        description: Pekerjaan utama orang tua
        example: Wiraswasta
        type: string
      parent_type:
        description: 'Kategori wali: ''FATHER'' (Ayah), ''MOTHER'' (Ibu), atau ''GUARDIAN''
          (Wali)'
        enum:
        - FATHER
        - MOTHER
        - GUARDIAN
        example: FATHER
        type: string
      phone:
        description: Nomor telepon seluler aktif orang tua
        example: "081398765432"
        type: string
    required:
    - full_name
    - parent_type
    type: object
  internal_subject.CreateCharacteristicPointRequest:
    properties:
      description:
        description: Deskripsi karakteristik CP mata pelajaran
        example: Pemahaman konsep bilangan cacah dan pecahan
        type: string
      elements:
        description: Daftar elemen sub-kompetensi mata pelajaran
        items:
          $ref: '#/definitions/internal_subject.CreateSubjectElementRequest'
        type: array
    required:
    - description
    type: object
  internal_subject.CreateSubjectElementRequest:
    properties:
      abbreviation:
        description: Singkatan sub-elemen (e.g. BIL, GEO)
        example: BIL
        maxLength: 20
        type: string
      description:
        description: Uraian cakupan materi sub-elemen
        example: Mencakup kemampuan mengurutkan, menjumlahkan...
        type: string
      element_name:
        description: Nama sub-elemen CP (e.g. Bilangan, Geometri, Pengukuran)
        example: Bilangan Cacah
        maxLength: 255
        type: string
    required:
    - element_name
    type: object
  internal_subject.CreateSubjectRequest:
    properties:
      abbreviation:
        description: Singkatan nama mata pelajaran (e.g. MTK, BIN)
        example: MTK
        maxLength: 20
        type: string
      characteristic_points:
        description: Elemen / Karakteristik CP yang diampu
        items:
          $ref: '#/definitions/internal_subject.CreateCharacteristicPointRequest'
        type: array
      characteristics:
        description: Karakteristik umum pengajaran mata pelajaran
        example: Pembelajaran berbasis eksplorasi...
        type: string
      goals:
        description: Tujuan pembelajaran mata pelajaran
        example: Membentuk pola pikir logis dan matematis...
        type: string
      is_active:
        description: Status keaktifan mata pelajaran
        example: true
        type: boolean
      level:
        description: Tingkatan sekolah (SD, SMP, SMA)
        example: SD
        maxLength: 10
        type: string
      rational:
        description: Rasionalitas mata pelajaran dalam kurikulum merdeka
        example: Kemampuan numerasi sangat krusial bagi...
        type: string
      subject_code:
        description: Kode unik mata pelajaran (e.g. MAT-SD-A)
        example: MAT-SD-A
        maxLength: 20
        type: string
      subject_name:
        description: Nama resmi mata pelajaran
        example: Matematika
        maxLength: 255
        type: string
    required:
    - subject_name
    type: object
  internal_subject.UpdateCharacteristicPointRequest:
    properties:
      description:
        example: Pemahaman konsep bilangan cacah dan pecahan
        type: string
      elements:
        items:
          $ref: '#/definitions/internal_subject.UpdateSubjectElementRequest'
        type: array
      id:
        description: UUID Karakteristik CP yang ingin diubah
        example: a425fa98-4362-4f74-9a33-8dcfbaeecc45
        type: string
    required:
    - description
    type: object
  internal_subject.UpdateSubjectElementRequest:
    properties:
      abbreviation:
        example: BIL
        maxLength: 20
        type: string
      description:
        example: Mencakup kemampuan mengurutkan, menjumlahkan...
        type: string
      element_name:
        example: Bilangan Cacah
        maxLength: 255
        type: string
      id:
        description: UUID Elemen CP yang ingin diubah
        example: cfd0a60c-8f12-4e2c-a217-9ac5a14de76c
        type: string
