  /system/audit-logs:
    get:
      description: Mengambil daftar catatan log audit aktivitas operasional sistem
        secara paginasi. Mendukung pencarian kueri berdasarkan nama/email pengguna
        dan penyaringan berdasarkan tipe aksi keamanan.
      parameters:
      - description: 'Nomor halaman aktif (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah entri log per halaman (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Kata kunci pencarian nama atau email aktor pengguna
        in: query
        name: search
        type: string
      - description: Penyaringan berdasarkan tipe aksi keamanan (e.g. LOGIN, UPDATE,
          DELETE)
        in: query
        name: action
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Data audit log berhasil diambil secara terpaginasi
          schema:
            allOf:
            - $ref: '#/definitions/sim-sekolah_internal_common.PaginationResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_system.AuditLog'
                  type: array
              type: object
        "500":
          description: Gagal mengambil data audit log
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      summary: Get System Audit Logs
      tags:
      - System & Dashboard
  /system/dashboard/guru:
    get:
