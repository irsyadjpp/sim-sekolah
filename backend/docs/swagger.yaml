    url: https://opensource.org/licenses/MIT
  termsOfService: http://example.com/terms/
  title: SIM Sekolah API
  version: "1.0"
paths:
  /academic/graduation:
    post:
      consumes:
      - application/json
      parameters:
      - description: Graduation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_promotion.GraduateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Graduate Students Massively
      tags:
      - Admin Promotion Management
  /academic/promotion:
    post:
      consumes:
      - application/json
      parameters:
      - description: Promotion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_promotion.PromoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Promote Students to Next Classroom
      tags:
      - Admin Promotion Management
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
