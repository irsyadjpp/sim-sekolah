      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      summary: Reset Password
      tags:
      - Auth
  /classrooms/{id}/schedules:
    get:
      parameters:
      - description: Classroom ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Get Schedules By Classroom
      tags:
      - Academic Schedule
  /curriculum-documents:
    get:
      consumes:
      - application/json
      description: Get a list of all curriculum documents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Get all curriculum documents
      tags:
      - Curriculum
    post:
      consumes:
      - application/json
      description: Creates a new curriculum document for the given academic year and
        school.
      parameters:
      - description: Initialize Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_curriculum.InitializeCurriculumRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Create a new curriculum document
      tags:
      - Curriculum
  /curriculum-documents/{id}:
    get:
      consumes:
      - application/json
      description: Get a curriculum document with all its chapters
      parameters:
      - description: Curriculum Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Get curriculum document by ID
      tags:
      - Curriculum
  /curriculum-documents/{id}/chapters/{chapter_number}:
    get:
      consumes:
      - application/json
      description: Retrieve HTML content for a specific chapter
      parameters:
      - description: Curriculum Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Chapter Number
        in: path
        name: chapter_number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Get Chapter Content
      tags:
      - Curriculum
