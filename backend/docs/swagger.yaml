      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
