        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_curriculum.TriggerChapterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Trigger Chapter Formulation
      tags:
      - Curriculum
  /curriculum-documents/readiness:
    get:
      consumes:
      - application/json
