      consumes:
      - application/json
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Menghapus Refresh Token dari database dan Cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Get Current User Profile
      tags:
      - Auth
    put:
      consumes:
      - application/json
      parameters:
      - description: Update Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Update Current User Profile
      tags:
      - Auth
  /auth/me/photo:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Profile Photo
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      security:
      - BearerAuth: []
      summary: Upload Profile Photo
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Memperbarui Access Token menggunakan Refresh Token dari HttpOnly
        Cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sim-sekolah_internal_common.Response'
      summary: Refresh Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 'Endpoint untuk registrasi guru/staf secara mandiri. Default role:
