basePath: /api/v1
definitions:
  internal_auth.ChangePasswordRequest:
    properties:
      current_password:
        description: Kata sandi aktif saat ini
        example: sandiLama123
        type: string
      new_password:
        description: Kata sandi baru minimal 8 karakter
        example: sandiBaru99
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  internal_auth.ForgotPasswordRequest:
    properties:
      email:
        description: Alamat email terdaftar untuk pemulihan sandi
        example: budi@sd.sch.id
        type: string
    required:
    - email
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        description: Alamat email resmi terdaftar
        example: admin@simsekolah.com
        type: string
      password:
        description: Kata sandi keamanan pengguna
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        description: Alamat email resmi pendaftar
        example: budi@sd.sch.id
        type: string
      full_name:
        description: Nama lengkap guru atau staf sekolah
        example: Budi Santoso
        type: string
      password:
        description: Kata sandi keamanan minimal 6 karakter
        example: budi1234
        minLength: 6
        type: string
      username:
        description: Username unik untuk login ke sistem
        example: budis
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  internal_auth.ResetPasswordRequest:
    properties:
      password:
        description: Kata sandi baru minimal 8 karakter
        example: sandiBaru999
        minLength: 8
        type: string
      token:
        description: Token unik pemulihan sandi yang dikirim lewat email
        example: abcdef123456
        type: string
    required:
    - password
    - token
    type: object
  internal_auth.UpdateMeRequest:
    properties:
      content_type:
        description: Lebar halaman kustomisasi antarmuka
        example: fluid
        type: string
      email_notifications:
        description: Pengaturan persetujuan notifikasi email
        example: false
        type: boolean
      full_name:
        description: Nama lengkap terbaru beserta gelar pendidikan
        example: Budi Santoso, S.Pd
        type: string
      left_menu_type:
        description: Model menu kiri kustomisasi antarmuka
        example: compact
        type: string
      push_notifications:
        description: Pengaturan persetujuan push notifikasi
        example: true
        type: boolean
      theme_color:
        description: Warna tema kustomisasi antarmuka
        example: theme-purple
        type: string
      theme_mode:
        description: Mode visual kustomisasi antarmuka
        example: light
        type: string
      two_factor_enabled:
        description: Pointer so we can differentiate false and nil (not sent)
        example: true
        type: boolean
      username:
        description: Username baru jika ingin diubah
        example: budi_santoso
        type: string
    type: object
  internal_cp.CreateCPDetailRequest:
    properties:
      detail_text:
        description: Deskripsi target capaian sub-kompetensi
        example: Pada akhir fase A, peserta didik...
        type: string
      element_id:
        description: UUID Elemen CP dari mata pelajaran terkait
        example: 7e83162c-cbeb-4cd6-b027-2239a1ca481c
        type: string
      sequence_no:
        description: Nomor urut alur pembelajaran (sequence)
        example: 1
        minimum: 1
        type: integer
      sub_code:
        description: Kode sub-kompetensi CP (e.g. CP.MAT.FA.01)
        example: CP.MAT.FA.01
        type: string
    required:
    - detail_text
    - element_id
    - sequence_no
    type: object
  internal_cp.CreateCPRequest:
    properties:
      cp_code:
        description: Kode unik dokumen CP (e.g. CP-MAT-FA)
        example: CP-MAT-FA
        maxLength: 50
        type: string
      details:
        description: Daftar rincian CP per sub-elemen kompetensi
        items:
          $ref: '#/definitions/internal_cp.CreateCPDetailRequest'
        type: array
      outcome_text:
        description: Uraian deskripsi komprehensif Capaian Pembelajaran Fase
        example: Peserta didik mampu memahami konsep...
        type: string
      phase_id:
        description: UUID Fase kelas (e.g. Fase A, Fase B, Fase C untuk SD)
        example: a425fa98-4362-4f74-9a33-8dcfbaeecc45
        type: string
      subject_id:
        description: UUID Mata Pelajaran pengampu CP
        example: c5d2f366-3ff2-422c-807a-44c618bef84f
        type: string
      year_sk:
        description: Tahun berlakunya SK Kemendikbudristek untuk CP ini
        example: "2024"
        maxLength: 10
        type: string
    required:
    - phase_id
    - subject_id
    - year_sk
    type: object
  internal_cp.UpdateCPDetailRequest:
    properties:
      detail_text:
        example: Pada akhir fase A, peserta didik...
        type: string
      element_id:
        example: 7e83162c-cbeb-4cd6-b027-2239a1ca481c
        type: string
      sequence_no:
        example: 1
        minimum: 1
        type: integer
      sub_code:
        example: CP.MAT.FA.01
        type: string
    type: object
  internal_cp.UpdateCPRequest:
    properties:
      cp_code:
        example: CP-MAT-FA
        maxLength: 50
        type: string
      details:
        items:
          $ref: '#/definitions/internal_cp.CreateCPDetailRequest'
        type: array
      outcome_text:
        example: Peserta didik mampu memahami konsep...
        type: string
      phase_id:
        example: a425fa98-4362-4f74-9a33-8dcfbaeecc45
        type: string
      subject_id:
        example: c5d2f366-3ff2-422c-807a-44c618bef84f
        type: string
      year_sk:
        example: "2024"
        maxLength: 10
        type: string
    type: object
  internal_curriculum.InitializeCurriculumRequest:
    properties:
      academic_year_id:
        type: string
      school_id:
        type: string
    required:
    - academic_year_id
    - school_id
    type: object
  internal_curriculum.TriggerChapterRequest:
    properties:
      chapter_number:
        type: integer
      curriculum_document_id:
        type: string
      title:
        type: string
    required:
    - chapter_number
    - curriculum_document_id
    - title
    type: object
  internal_curriculum.UpdateChapterRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  internal_permission.AssignPermissionsRequest:
    properties:
      permission_ids:
        items:
          type: string
        type: array
    required:
    - permission_ids
    type: object
  internal_permission.Permission:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      permission_name:
        type: string
    type: object
  internal_phase.CreatePhaseRequest:
    properties:
      code:
        maxLength: 5
        type: string
      description:
        type: string
      name:
        maxLength: 50
        type: string
    required:
    - code
    - name
    type: object
  internal_phase.UpdatePhaseRequest:
    properties:
      code:
        maxLength: 5
        type: string
      description:
        type: string
      name:
        maxLength: 50
        type: string
