global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ai-platform-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Gateway Service
  - job_name: 'gateway-service'
    static_configs:
      - targets: ['gateway-service:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Monitoring Service
  - job_name: 'monitoring-service'
    static_configs:
      - targets: ['monitoring-service:8006']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Parser Service (when available)
  - job_name: 'parser-service'
    static_configs:
      - targets: ['parser-service:8008']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Semantic Chunk Service (when available)
  - job_name: 'semantic-chunk-service'
    static_configs:
      - targets: ['semantic-chunk-service:8011']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Embedding Service (when available)
  - job_name: 'embedding-service'
    static_configs:
      - targets: ['embedding-service:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Retrieval Service (when available)
  - job_name: 'retrieval-service'
    static_configs:
      - targets: ['retrieval-service:8010']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Generation Service (when available)
  - job_name: 'generation-service'
    static_configs:
      - targets: ['generation-service:8003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # RabbitMQ Exporter
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
    scrape_interval: 30s

  # Qdrant Exporter
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node Exporter (for system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s