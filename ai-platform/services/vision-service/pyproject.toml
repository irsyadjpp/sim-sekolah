[project]
name = "vision-service"
version = "0.1.0"
description = "AI Platform Vision Service - Image processing and OCR"
requires-python = ">=3.11"
dependencies = [
    # Core API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    
    # Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    
    # Database
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    
    # Cache
    "redis>=5.0.0",
    
    # Queue
    "aio-pika>=9.4.0",
    
    # Object Storage
    "minio>=7.2.7",
    
    # OCR
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    
    # Vision
    "transformers>=4.44.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    
    # Data Processing
    "numpy>=2.0.1",
    "opencv-python-headless>=4.10.0",
    
    # Shared packages
    "ai-platform-shared",
    "ai-platform-shared-grpc",
    "ai-platform-shared-schemas",
    "ai-platform-shared-events",
    "ai-platform-shared-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]