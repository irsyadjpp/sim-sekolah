[project]
name = "ai-platform-shared"
version = "0.1.0"
description = "AI Platform Shared Libraries - Cross-service utilities and contracts"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    
    # Async
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Validation
    "email-validator>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]