[project]
name = "ai-platform-storage-abstractions"
version = "0.1.0"
description = "Unified storage abstractions for AI Platform backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.28.0",
]
qdrant = [
    "qdrant-client>=1.7.0",
]
neo4j = [
    "neo4j>=5.0.0",
]
postgresql = [
    "asyncpg>=0.29.0",
]
all = [
    "ai-platform-storage-abstractions[s3,qdrant,neo4j,postgresql]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]