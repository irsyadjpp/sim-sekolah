apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-service
  namespace: ai-platform
  labels:
    app: orchestration-service
    tier: governance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestration-service
  template:
    metadata:
      labels:
        app: orchestration-service
        tier: governance
    spec:
      containers:
      - name: orchestration-service
        image: orchestration-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8012
          name: http
        - containerPort: 50061
          name: grpc
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: url
        - name: ENABLE_GRPC_SERVER
          value: "true"
        - name: ENABLE_RABBITMQ_CONSUMER
          value: "true"
        - name: GRPC_PORT
          value: "50061"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration-service
  namespace: ai-platform
  labels:
    app: orchestration-service
spec:
  type: ClusterIP
  ports:
  - port: 8012
    targetPort: 8012
    name: http
  - port: 50061
    targetPort: 50061
    name: grpc
  selector:
    app: orchestration-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestration-service-hpa
  namespace: ai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestration-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
