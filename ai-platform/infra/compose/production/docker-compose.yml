version: '3.8'

# Production environment overrides
# Usage: docker-compose -f docker-compose.yml -f infra/compose/production/docker-compose.yml up
# Note: For production, consider using Kubernetes instead of Docker Compose

services:
  # Production-specific configurations
  # No volume mounts, resource limits, security hardening
  gateway-service:
    volumes: []
    environment:
      - LOG_LEVEL=WARNING
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

