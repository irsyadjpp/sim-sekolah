version: '3.8'

# Staging environment overrides
# Usage: docker-compose -f docker-compose.yml -f infra/compose/staging/docker-compose.yml up

services:
  # Staging-specific configurations
  # Remove hot-reloading, use production-like settings
  gateway-service:
    volumes:
      # No volume mounts for staging - use built images
    environment:
      - LOG_LEVEL=INFO
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

