version: '3.8'

# Development environment overrides
# Usage: docker-compose -f docker-compose.yml -f infra/compose/dev/docker-compose.yml up

services:
  # Development-specific configurations
  # Enable hot-reloading for Python services
  gateway-service:
    volumes:
      - ./services/gateway-service:/app
    environment:
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1

  parser-service:
    volumes:
      - ./services/parser-service:/app
      - ./shared:/app/shared
    environment:
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1

  semantic-chunk-service:
    volumes:
      - ./services/semantic-chunk-service:/app
