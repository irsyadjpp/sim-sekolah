[project]
name = "ai-platform-pipelines"
version = "0.1.0"
description = "AI Platform Pipelines - Data processing and ML workflows"
requires-python = ">=3.11"
dependencies = [
    # Prefect for orchestration
    "prefect>=2.14.0",
    "prefect-dask>=0.2.0",
    "prefect-docker>=0.2.0",
    
    # Shared packages
    "ai-platform-shared",
    "ai-platform-shared-grpc",
    "ai-platform-shared-schemas",
    "ai-platform-shared-events",
    "ai-platform-shared-observability",
    
    # Database
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.11.0",
    
    # Async
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    
    # Data processing
    "pandas>=2.2.2",
    "numpy>=2.0.1",
    
    # ML
    "sentence-transformers>=3.0.1",
    "transformers>=4.44.0",
    
    # Monitoring
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.2",
    "mypy>=1.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true