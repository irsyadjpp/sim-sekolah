[project]
name = "ai-platform-shared-observability"
version = "0.1.0"
description = "AI Platform Shared Observability - Logging, metrics, tracing helpers"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]