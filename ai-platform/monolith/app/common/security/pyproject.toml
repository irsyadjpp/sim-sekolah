[project]
name = "ai-platform-shared-security"
version = "0.1.0"
description = "AI Platform Shared Security - JWT validation, RBAC, audit context"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]