[project]
name = "ai-platform-shared-schemas"
version = "0.1.0"
description = "AI Platform Shared Schemas - Pydantic and JSON-Schema contracts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]