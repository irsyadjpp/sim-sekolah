apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-progression-engine
  namespace: ai-platform
  labels:
    app: learning-progression-engine
    tier: educational
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learning-progression-engine
  template:
    metadata:
      labels:
        app: learning-progression-engine
        tier: educational
    spec:
      containers:
      - name: learning-progression-engine
        image: learning-progression-engine:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8016
          name: http
        - containerPort: 50065
          name: grpc
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: url
        - name: ENABLE_GRPC_SERVER
          value: "true"
        - name: ENABLE_RABBITMQ_CONSUMER
          value: "true"
        - name: GRPC_PORT
          value: "50065"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8016
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8016
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: learning-progression-engine
  namespace: ai-platform
  labels:
    app: learning-progression-engine
spec:
  type: ClusterIP
  ports:
  - port: 8016
    targetPort: 8016
    name: http
  - port: 50065
    targetPort: 50065
    name: grpc
  selector:
    app: learning-progression-engine
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learning-progression-engine-hpa
  namespace: ai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learning-progression-engine
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
