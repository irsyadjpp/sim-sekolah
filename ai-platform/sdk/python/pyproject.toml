[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simsekolah-ai"
version = "0.1.0"
description = "Python SDK for SimSekolah AI Platform services"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "SimSekolah Platform Team", email = "platform@simsekolah.com"}
]
maintainers = [
    {name = "SimSekolah Platform Team", email = "platform@simsekolah.com"}
]
keywords = [
    "ai",
    "machine learning",
    "nlp",
    "rag",
    "llm",
    "grpc",
    "client",
    "sdk"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "grpcio>=1.50.0",
    "grpcio-health-checking>=1.0.0",
    "protobuf>=4.0.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "circuitbreaker>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

all = [
    "simsekolah-ai[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/simsekolah/ai-platform-sdk-python"
Documentation = "https://github.com/simsekolah/ai-platform-sdk-python#readme"
Repository = "https://github.com/simsekolah/ai-platform-sdk-python.git"
Issues = "https://github.com/simsekolah/ai-platform-sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["simsekolah_ai"]

[tool.hatch.build.targets.sdist]
include = [
    "/simsekolah_ai",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=simsekolah_ai",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["simsekolah_ai"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]