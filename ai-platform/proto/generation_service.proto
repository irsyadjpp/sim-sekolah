syntax = "proto3";

package ai_platform.generation_service;

option go_package = "sim-sekolah/backend/internal/ai/grpc";

// Generation Service - Fase 3.3
service GenerationService {
    rpc GenerateText(GenerateTextRequest) returns (GenerateTextResponse);
    rpc GenerateWithContext(GenerateWithContextRequest) returns (GenerateWithContextResponse);
    rpc StreamText(StreamTextRequest) returns (stream StreamTextResponse);
    rpc GenerateQuiz(GenerateQuizRequest) returns (GenerateQuizResponse);
    rpc GenerateLessonPlan(GenerateLessonPlanRequest) returns (GenerateLessonPlanResponse);
    rpc GenerateExplanation(GenerateExplanationRequest) returns (GenerateExplanationResponse);
}

// Generation Service Messages
message GenerateTextRequest {
    string request_id = 1;
    string prompt = 2;
    string provider = 3;
    string model = 4;
    float temperature = 5;
    int32 max_tokens = 6;
    map<string, string> parameters = 7;
}

message GenerateTextResponse {
    bool success = 1;
    string message = 2;
    GenerationResult result = 3;
    map<string, string> metadata = 4;
}

message GenerationResult {
    string generated_text = 1;
    int32 tokens_used = 2;
    float generation_time_ms = 3;
    string model = 4;
    string provider = 5;
}

message GenerateWithContextRequest {
    string request_id = 1;
    string prompt = 2;
    string context = 3;
    string provider = 4;
    string model = 5;
    float temperature = 6;
    int32 max_tokens = 7;
    map<string, string> parameters = 8;
}

message GenerateWithContextResponse {
    bool success = 1;
    string message = 2;
    GenerationResult result = 3;
    map<string, string> metadata = 4;
}

message StreamTextRequest {
    string request_id = 1;
    string prompt = 2;
    string provider = 3;
    string model = 4;
    float temperature = 5;
    int32 max_tokens = 6;
    map<string, string> parameters = 7;
}

message StreamTextResponse {
    string chunk_id = 1;
    string text_chunk = 2;
    bool is_last = 3;
    map<string, string> metadata = 4;
}

message GenerateQuizRequest {
    string request_id = 1;
    string topic = 2;
    string subject = 3;
    string grade = 4;
    int32 num_questions = 5;
    string difficulty = 6;
    string question_type = 7;
    map<string, string> options = 8;
}

message GenerateQuizResponse {
    bool success = 1;
    string message = 2;
    QuizGenerationResult result = 3;
    map<string, string> metadata = 4;
}

message QuizGenerationResult {
    repeated QuizQuestion questions = 1;
    string quiz_topic = 2;
    string difficulty_level = 3;
}

message QuizQuestion {
    string question_id = 1;
    string question_text = 2;
    repeated string options = 3;
    string correct_answer = 4;
    string explanation = 5;
}

message GenerateLessonPlanRequest {
    string request_id = 1;
    string topic = 2;
    string subject = 3;
    string grade = 4;
    int32 duration_minutes = 5;
    repeated string learning_objectives = 6;
    string pedagogy_type = 7;
    map<string, string> options = 8;
}

message GenerateLessonPlanResponse {
    bool success = 1;
    string message = 2;
    LessonPlanResult result = 3;
    map<string, string> metadata = 4;
}

message LessonPlanResult {
    LessonPlan lesson_plan = 1;
}

message LessonPlan {
    string plan_id = 1;
    string topic = 2;
    repeated LessonActivity activities = 3;
    repeated LessonResource resources = 4;
    string assessment_strategy = 5;
}

message LessonActivity {
    string activity_id = 1;
    string title = 2;
    string description = 3;
    int32 duration_minutes = 4;
    string activity_type = 5;
}

message LessonResource {
    string resource_id = 1;
    string resource_type = 2;
    string title = 3;
    string url_or_path = 4;
}

message GenerateExplanationRequest {
    string request_id = 1;
    string concept = 2;
    string subject = 3;
    string grade = 4;
    string explanation_type = 5;
    string target_audience = 6;
    map<string, string> options = 7;
}

message GenerateExplanationResponse {
    bool success = 1;
    string message = 2;
    ExplanationResult result = 3;
    map<string, string> metadata = 4;
}

message ExplanationResult {
    string explanation_text = 1;
    repeated ExplanationSection sections = 2;
    repeated Example examples = 3;
}

message ExplanationSection {
    string section_title = 1;
    string section_content = 2;
}

message Example {
    string example_id = 1;
    string description = 2;
    string solution = 3;
}
