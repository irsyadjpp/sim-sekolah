syntax = "proto3";

package audit;

// Audit Service gRPC definitions
service AuditService {
  // Log an audit event
  rpc LogEvent(LogEventRequest) returns (LogEventResponse);
  
  // Query audit logs
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);
  
  // Check compliance for an event
  rpc CheckCompliance(ComplianceCheckRequest) returns (ComplianceCheckResponse);
  
  // Get audit statistics
  rpc GetAuditStats(Empty) returns (AuditStatsResponse);
}

// Log event request
message LogEventRequest {
  string id = 1;
  string user_id = 2;
  string session_id = 3;
  string request_id = 4;
  string event_type = 5;
  map<string, string> event_data = 6;
  float latency_ms = 7;
  int32 token_count = 8;
  string model_version = 9;
  string compliance_status = 10;
  string ip_address = 11;
  string user_agent = 12;
}

// Log event response
message LogEventResponse {
  string id = 1;
  string status = 2;
}

// Query logs request
message QueryLogsRequest {
  string user_id = 1;
  string session_id = 2;
  string event_type = 3;
  int64 start_timestamp = 4;
  int64 end_timestamp = 5;
  int32 limit = 6;
  int32 offset = 7;
}

// Query logs response
message QueryLogsResponse {
  repeated AuditLog logs = 1;
}

// Audit log
message AuditLog {
  string id = 1;
  int64 timestamp = 2;
  string user_id = 3;
  string session_id = 4;
  string request_id = 5;
  string event_type = 6;
  map<string, string> event_data = 7;
  float latency_ms = 8;
  int32 token_count = 9;
  string model_version = 10;
  string compliance_status = 11;
  string ip_address = 12;
  string user_agent = 13;
}

// Compliance check request
message ComplianceCheckRequest {
  string request_id = 1;
  string event_type = 2;
  map<string, string> event_data = 3;
  string user_id = 4;
}

// Compliance check response
message ComplianceCheckResponse {
  string request_id = 1;
  bool is_compliant = 2;
  repeated string violations = 3;
  string compliance_status = 4;
}

// Empty message
message Empty {}

// Audit stats response
message AuditStatsResponse {
  int64 total_logs = 1;
  repeated EventTypeStat event_types = 2;
  repeated ComplianceStat compliance_stats = 3;
}

// Event type stat
message EventTypeStat {
  string event_type = 1;
  int64 count = 2;
}

// Compliance stat
message ComplianceStat {
  string compliance_status = 1;
  int64 count = 2;
}
