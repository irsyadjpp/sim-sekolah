syntax = "proto3";

package ai.platform.common.v1;

// Standard error codes for the AI Platform
enum ErrorCode {
  // General errors
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNKNOWN = 1;
  ERROR_CODE_INTERNAL = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_INVALID_ARGUMENT = 5;
  ERROR_CODE_PERMISSION_DENIED = 6;
  ERROR_CODE_UNAUTHENTICATED = 7;
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  ERROR_CODE_FAILED_PRECONDITION = 9;
  ERROR_CODE_ABORTED = 10;
  ERROR_CODE_OUT_OF_RANGE = 11;
  ERROR_CODE_UNIMPLEMENTED = 12;
  ERROR_CODE_UNAVAILABLE = 13;
  ERROR_CODE_DATA_LOSS = 14;

  // Document processing errors
  ERROR_CODE_INVALID_DOCUMENT = 100;
  ERROR_CODE_UNSUPPORTED_FORMAT = 101;
  ERROR_CODE_CORRUPTED_FILE = 102;
  ERROR_CODE_PARSE_FAILED = 103;
  ERROR_CODE_OCR_FAILED = 104;
  ERROR_CODE_EXTRACTION_FAILED = 105;

  // Vector database errors
  ERROR_CODE_VECTOR_DB_ERROR = 200;
  ERROR_CODE_COLLECTION_NOT_FOUND = 201;
  ERROR_CODE_INDEX_FAILED = 202;
  ERROR_CODE_SEARCH_FAILED = 203;
  ERROR_CODE_EMBEDDING_FAILED = 204;

  // AI/ML errors
  ERROR_CODE_MODEL_ERROR = 300;
  ERROR_CODE_MODEL_NOT_FOUND = 301;
  ERROR_CODE_INFERENCE_FAILED = 302;
  ERROR_CODE_MODERATION_FAILED = 303;
  ERROR_CODE_GENERATION_FAILED = 304;

  // Rate limiting errors
  ERROR_CODE_RATE_LIMIT_EXCEEDED = 400;
  ERROR_CODE_QUOTA_EXCEEDED = 401;

  // Validation errors
  ERROR_CODE_VALIDATION_ERROR = 500;
  ERROR_CODE_SCHEMA_VIOLATION = 501;
  ERROR_CODE_CONSTRAINT_VIOLATION = 502;
}

// Standard error message
message Error {
  ErrorCode code = 1;
  string message = 2;
  repeated string details = 3;
  string request_id = 4;
  map<string, string> metadata = 5;
}