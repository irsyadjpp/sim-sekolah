syntax = "proto3";

package ai.platform.common.v1;

// Common enumerations used across services

// Document format types
enum DocumentFormat {
  DOCUMENT_FORMAT_UNSPECIFIED = 0;
  DOCUMENT_FORMAT_PDF = 1;
  DOCUMENT_FORMAT_DOCX = 2;
  DOCUMENT_FORMAT_DOC = 3;
  DOCUMENT_FORMAT_TXT = 4;
  DOCUMENT_FORMAT_MD = 5;
  DOCUMENT_FORMAT_HTML = 6;
  DOCUMENT_FORMAT_PPTX = 7;
  DOCUMENT_FORMAT_XLSX = 8;
  DOCUMENT_FORMAT_IMAGE = 9;
}

// Document processing status
enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DOCUMENT_STATUS_PENDING = 1;
  DOCUMENT_STATUS_PROCESSING = 2;
  DOCUMENT_STATUS_COMPLETED = 3;
  DOCUMENT_STATUS_FAILED = 4;
  DOCUMENT_STATUS_PARTIAL = 5; // Some pages failed
}

// Content types
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  CONTENT_TYPE_TEXT = 1;
  CONTENT_TYPE_IMAGE = 2;
  CONTENT_TYPE_TABLE = 3;
  CONTENT_TYPE_FORMULA = 4;
  CONTENT_TYPE_CODE = 5;
  CONTENT_TYPE_METADATA = 6;
}

// Chunk strategy types
enum ChunkStrategy {
  CHUNK_STRATEGY_UNSPECIFIED = 0;
  CHUNK_STRATEGY_FIXED_SIZE = 1;
  CHUNK_STRATEGY_RECURSIVE = 2;
  CHUNK_STRATEGY_SEMANTIC = 3;
  CHUNK_STRATEGY_HYBRID = 4;
}

// Embedding model types
enum EmbeddingModel {
  EMBEDDING_MODEL_UNSPECIFIED = 0;
  EMBEDDING_MODEL_BGE_M3 = 1;
  EMBEDDING_MODEL_BGE_SMALL = 2;
  EMBEDDING_MODEL_OPENAI_ADA = 3;
  EMBEDDING_MODEL_OPENAI_SMALL = 4;
  EMBEDDING_MODEL_COHERE_EMBED = 5;
}

// Generation model types
enum GenerationModel {
  GENERATION_MODEL_UNSPECIFIED = 0;
  GENERATION_MODEL_GPT_4 = 1;
  GENERATION_MODEL_GPT_35_TURBO = 2;
  GENERATION_MODEL_CLAUDE_3_OPUS = 3;
  GENERATION_MODEL_CLAUDE_3_SONNET = 4;
  GENERATION_MODEL_CLAUDE_3_HAIKU = 5;
  GENERATION_MODEL_LLAMA_3_8B = 6;
  GENERATION_MODEL_LLAMA_3_70B = 7;
}

// Moderation categories
enum ModerationCategory {
  MODERATION_CATEGORY_UNSPECIFIED = 0;
  MODERATION_CATEGORY_VIOLENCE = 1;
  MODERATION_CATEGORY_SEXUAL = 2;
  MODERATION_CATEGORY_HATE = 3;
  MODERATION_CATEGORY_HARASSMENT = 4;
  MODERATION_CATEGORY_SELF_HARM = 5;
  MODERATION_CATEGORY_ILLEGAL = 6;
  MODERATION_CATEGORY_MISINFORMATION = 7;
}

// Retrieval modes
enum RetrievalMode {
  RETRIEVAL_MODE_UNSPECIFIED = 0;
  RETRIEVAL_MODE_VECTOR = 1;
  RETRIEVAL_MODE_KEYWORD = 2;
  RETRIEVAL_MODE_HYBRID = 3;
  RETRIEVAL_MODE_SEMANTIC = 4;
}

// Log levels
enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
  LOG_LEVEL_CRITICAL = 5;
}

// Environment types
enum Environment {
  ENVIRONMENT_UNSPECIFIED = 0;
  ENVIRONMENT_DEVELOPMENT = 1;
  ENVIRONMENT_STAGING = 2;
  ENVIRONMENT_PRODUCTION = 3;
}