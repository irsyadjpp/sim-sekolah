[project]
name = "ai-platform"
version = "0.1.0"
description = "Enterprise Educational Intelligence Platform - Monorepo Workspace"
requires-python = ">=3.11"
readme = "README.md"

[tool.uv.workspace]
members = [
    "shared/*",
    "services/gateway-service",
    "services/parser-service",
    "services/semantic-chunk-service",
    "services/metadata-service",
    "services/embedding-service",
    "services/retrieval-service",
    "services/generation-service",
    "services/audit-service",
    "services/monitoring-service",
    "services/moderation-service",
    "services/reranking-service",
    "services/vision-service",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
    "black>=24.8.0",
    "isort>=5.13.2",
    "mypy>=1.11.1",
    "bandit>=1.7.9",
    "pre-commit>=3.8.0",
]

[tool.uv.sources]

# =========================
# BLACK
# =========================

[tool.black]
line-length = 88
target-version = ["py311"]

# =========================
# ISORT
# =========================

[tool.isort]
profile = "black"
line_length = 88

# =========================
# RUFF
# =========================

[tool.ruff]
line-length = 88
target-version = ["py311"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

# =========================
# MYPY
# =========================

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# =========================
# PYTEST
# =========================

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# =========================
# COVERAGE
# =========================

[tool.coverage.run]
branch = true
source = ["shared", "services"]

[tool.coverage.report]
show_missing = true
skip_covered = true